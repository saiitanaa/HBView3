name: HBView3 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz

          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            make \
            pkg-config \
            cmake \
            ninja-build \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libwayland-dev \
            wayland-protocols \
            libfreetype6-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          cmake --version

      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --target ${{ matrix.target }}

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo test --target ${{ matrix.target }}

      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist

          cp "target/${{ matrix.target }}/release/HBView3" \
             "dist/HBView3"

          tar -czf \
            "dist/HBView3-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C dist HBView3

          rm "dist/HBView3"

      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/HBView3.exe" `
            "dist/HBView3.exe"

          Compress-Archive `
            -Path "dist/HBView3.exe" `
            -DestinationPath "dist/HBView3-${{ github.ref_name }}-${{ matrix.target }}.zip"

          Remove-Item "dist/HBView3.exe"

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: HBView3-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        run: |
          find dist -maxdepth 2 -type f -print

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "HBView3 ${{ github.ref_name }}" \
            --generate-notesgit diff -- .github/workflows/release.yml
