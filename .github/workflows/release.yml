name: HBView3 Release

on:
push:
tags:
- "v*"

permissions:
contents: write

env:
CARGO_TERM_COLOR: always

jobs:
macos-arm64:
name: Build macOS ARM64
runs-on: macos-15

```
steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      target: aarch64-apple-darwin

  - name: Build
    run: cargo build --release --target aarch64-apple-darwin

  - name: Upload ARM64 binary
    uses: actions/upload-artifact@v6
    with:
      name: macos-arm64
      path: target/aarch64-apple-darwin/release/HBView3
```

macos-x86_64:
name: Build macOS Intel
runs-on: macos-15-intel

```
steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      target: x86_64-apple-darwin

  - name: Build
    run: cargo build --release --target x86_64-apple-darwin

  - name: Upload Intel binary
    uses: actions/upload-artifact@v6
    with:
      name: macos-x86_64
      path: target/x86_64-apple-darwin/release/HBView3
```

macos-universal:
name: Package macOS Universal
needs:
- macos-arm64
- macos-x86_64
runs-on: macos-15

```
steps:
  - name: Download ARM64 binary
    uses: actions/download-artifact@v5
    with:
      name: macos-arm64
      path: build/arm64

  - name: Download Intel binary
    uses: actions/download-artifact@v5
    with:
      name: macos-x86_64
      path: build/x86_64

  - name: Create Universal binary
    run: |
      mkdir -p dist

      chmod +x build/arm64/HBView3
      chmod +x build/x86_64/HBView3

      lipo -create \
        build/arm64/HBView3 \
        build/x86_64/HBView3 \
        -output dist/HBView3

      chmod +x dist/HBView3

      file dist/HBView3
      lipo -info dist/HBView3

  - name: Package macOS
    run: |
      tar -czf \
        "HBView3-${{ github.ref_name }}-macos.tar.gz" \
        -C dist \
        HBView3

  - name: Upload macOS release
    uses: actions/upload-artifact@v6
    with:
      name: release-macos
      path: HBView3-${{ github.ref_name }}-macos.tar.gz
```

linux:
name: Build Linux x86_64
runs-on: ubuntu-24.04

```
steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Install Linux dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        libxcb-render0-dev \
        libxcb-shape0-dev \
        libxcb-xfixes0-dev \
        libxkbcommon-dev

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      target: x86_64-unknown-linux-gnu

  - name: Build
    run: cargo build --release --target x86_64-unknown-linux-gnu

  - name: Package Linux
    run: |
      mkdir -p dist

      cp \
        target/x86_64-unknown-linux-gnu/release/HBView3 \
        dist/HBView3

      chmod +x dist/HBView3

      tar -czf \
        "HBView3-${{ github.ref_name }}-linux.tar.gz" \
        -C dist \
        HBView3

  - name: Upload Linux release
    uses: actions/upload-artifact@v6
    with:
      name: release-linux
      path: HBView3-${{ github.ref_name }}-linux.tar.gz
```

windows:
name: Build Windows x86_64
runs-on: windows-2025

```
steps:
  - name: Checkout
    uses: actions/checkout@v5

  - name: Install Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      target: x86_64-pc-windows-msvc

  - name: Build
    run: cargo build --release --target x86_64-pc-windows-msvc

  - name: Package Windows
    shell: pwsh
    run: |
      New-Item -ItemType Directory -Force -Path dist | Out-Null

      Copy-Item `
        "target/x86_64-pc-windows-msvc/release/HBView3.exe" `
        "dist/HBView3.exe"

      Compress-Archive `
        -Path "dist/HBView3.exe" `
        -DestinationPath "HBView3-${{ github.ref_name }}-windows.zip"

  - name: Upload Windows release
    uses: actions/upload-artifact@v6
    with:
      name: release-windows
      path: HBView3-${{ github.ref_name }}-windows.zip
```

release:
name: Create GitHub Release
needs:
- macos-universal
- linux
- windows
runs-on: ubuntu-24.04

```
steps:
  - name: Download macOS release
    uses: actions/download-artifact@v5
    with:
      name: release-macos
      path: dist

  - name: Download Linux release
    uses: actions/download-artifact@v5
    with:
      name: release-linux
      path: dist

  - name: Download Windows release
    uses: actions/download-artifact@v5
    with:
      name: release-windows
      path: dist

  - name: Show release files
    run: |
      find dist -type f -maxdepth 1 -print

  - name: Create GitHub Release
    env:
      GH_TOKEN: ${{ github.token }}
    run: |
      gh release create "${{ github.ref_name }}" \
        dist/* \
        --title "HBView3 ${{ github.ref_name }}" \
        --generate-notes
```

