name: HBView3 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz

          # macOS Intel
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

          # Linux x86_64
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          # Linux ARM64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

          # Windows x86_64
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show versions
        run: |
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      # -------------------------
      # Unix archive
      # -------------------------
      - name: Package Unix
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist

          cp "target/${{ matrix.target }}/release/HBView3" \
             "dist/HBView3"

          tar -czf \
            "dist/HBView3-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            -C dist HBView3

          rm "dist/HBView3"

      # -------------------------
      # Windows archive
      # -------------------------
      - name: Package Windows
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item `
            "target/${{ matrix.target }}/release/HBView3.exe" `
            "dist/HBView3.exe"

          Compress-Archive `
            -Path "dist/HBView3.exe" `
            -DestinationPath "dist/HBView3-${{ github.ref_name }}-${{ matrix.target }}.zip"

          Remove-Item "dist/HBView3.exe"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HBView3-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        run: |
          find dist -type f -maxdepth 2 -print

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "HBView3 ${{ github.ref_name }}" \
            --generate-notes
