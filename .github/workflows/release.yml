name: HBView3 Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # macOS Apple Silicon
          - name: macOS ARM64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz

          # macOS Intel
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz

          # Linux x86_64
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz

          # Linux ARM64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz

          # Windows x86_64
          - name: Windows x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            make \
            pkg-config \
            cmake \
            ninja-build \
            patchelf \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libwayland-dev \
            wayland-protocols \
            libfreetype6-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Show versions
        run: |
          rustc --version
          cargo --version
          cmake --version

      - name: Build
        if: runner.os != 'Windows'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --target ${{ matrix.target }}

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: cargo test --target ${{ matrix.target }}

      # ============================================================
      # macOS
      # ============================================================

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e

          BUILD_DIR="target/${{ matrix.target }}/release"
          DIST_DIR="dist"

          mkdir -p "$DIST_DIR/Assets"

          cp "$BUILD_DIR/HBView3" "$DIST_DIR/HBView3"
          cp -R Assets/. "$DIST_DIR/Assets/"

          echo "Searching for SDL3 libraries..."

          find "$BUILD_DIR" \
            -type f \
            \( -name "libSDL3*.dylib" -o -name "libSDL3_ttf*.dylib" \) \
            -exec cp {} "$DIST_DIR/" \;

          echo "Packaged files:"
          find "$DIST_DIR" -maxdepth 2 -type f -print

          echo "Patching executable RPATH..."

          install_name_tool \
            -add_rpath "@executable_path" \
            "$DIST_DIR/HBView3"

          echo "Executable dependencies:"
          otool -L "$DIST_DIR/HBView3"

          echo "SDL_ttf dependencies:"
          SDL_TTF="$(find "$DIST_DIR" -maxdepth 1 -name 'libSDL3_ttf*.dylib' | head -n 1)"

          if [ -n "$SDL_TTF" ]; then
            otool -L "$SDL_TTF"
          fi

          ARCHIVE="dist/HBView3-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"

          tar -czf "$ARCHIVE" \
            -C "$DIST_DIR" \
            HBView3 \
            Assets \
            $(find "$DIST_DIR" -maxdepth 1 -name 'libSDL3*.dylib' -printf '%f\n')

          rm "$DIST_DIR/HBView3"
          rm -rf "$DIST_DIR/Assets"

          find "$DIST_DIR" -maxdepth 1 -type f -print

      # ============================================================
      # Linux
      # ============================================================

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e

          BUILD_DIR="target/${{ matrix.target }}/release"
          DIST_DIR="dist"

          mkdir -p "$DIST_DIR/Assets"

          cp "$BUILD_DIR/HBView3" "$DIST_DIR/HBView3"
          cp -R Assets/. "$DIST_DIR/Assets/"

          echo "Searching for SDL3 libraries..."

          find "$BUILD_DIR" \
            -type f \
            \( -name "libSDL3*.so*" -o -name "libSDL3_ttf*.so*" \) \
            -exec cp {} "$DIST_DIR/" \;

          echo "Packaged files:"
          find "$DIST_DIR" -maxdepth 2 -type f -print

          echo "Patching Linux RPATH..."

          patchelf \
            --set-rpath '$ORIGIN' \
            "$DIST_DIR/HBView3"

          for library in "$DIST_DIR"/libSDL3*.so*; do
            if [ -f "$library" ]; then
              patchelf --set-rpath '$ORIGIN' "$library"
            fi
          done

          echo "Executable dependencies:"
          ldd "$DIST_DIR/HBView3"

          ARCHIVE="dist/HBView3-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"

          tar -czf "$ARCHIVE" \
            -C "$DIST_DIR" \
            HBView3 \
            Assets \
            $(find "$DIST_DIR" -maxdepth 1 -name 'libSDL3*.so*' -printf '%f\n')

          rm "$DIST_DIR/HBView3"
          rm -rf "$DIST_DIR/Assets"

          find "$DIST_DIR" -maxdepth 1 -type f -print

      # ============================================================
      # Windows
      # ============================================================

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $BuildDir = "target/${{ matrix.target }}/release"
          $DistDir = "dist"

          New-Item -ItemType Directory -Force -Path $DistDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$DistDir/Assets" | Out-Null

          Copy-Item `
            "$BuildDir/HBView3.exe" `
            "$DistDir/HBView3.exe"

          Copy-Item `
            "Assets/*" `
            "$DistDir/Assets/" `
            -Recurse

          Write-Host "Searching for SDL3 DLLs..."

          $dlls = Get-ChildItem `
            -Path $BuildDir `
            -Recurse `
            -File `
            -Filter "*.dll" |
            Where-Object {
              $_.Name -eq "SDL3.dll" -or
              $_.Name -eq "SDL3_ttf.dll"
            }

          if ($dlls.Count -eq 0) {
            throw "SDL3 DLLs were not found"
          }

          foreach ($dll in $dlls) {
            Write-Host "Copying $($dll.FullName)"
            Copy-Item $dll.FullName "$DistDir/$($dll.Name)" -Force
          }

          Write-Host "Packaged files:"
          Get-ChildItem $DistDir -Recurse

          $Archive = "dist/HBView3-${{ github.ref_name }}-${{ matrix.target }}.zip"

          Compress-Archive `
            -Path "$DistDir/*" `
            -DestinationPath $Archive

          Remove-Item "$DistDir/HBView3.exe" -Force
          Remove-Item "$DistDir/Assets" -Recurse -Force

          Get-ChildItem $DistDir

      # ============================================================
      # Upload
      # ============================================================
      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: HBView3-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # ================================================================
  # GitHub Release
  # ================================================================

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all builds
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Show release files
        run: |
          echo "=== Release files ==="
          find dist -maxdepth 1 -type f -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/* \
            --title "HBView3 ${{ github.ref_name }}" \
            --notes "## HBView3 ${{ github.ref_name }}

          ### Downloads

          - **macOS ARM64** — Apple Silicon
          - **macOS x86_64** — Intel
          - **Linux ARM64**
          - **Linux x86_64**
          - **Windows x86_64**

          The required SDL3 libraries are included in each archive."